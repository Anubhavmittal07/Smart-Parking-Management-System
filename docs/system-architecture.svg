<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
<title id="title">Smart Parking Management System logical architecture</title>
<desc id="desc">Layered client-server architecture showing driver and administrator clients, HTTPS REST API, domain services, data access, relational database, and external payment, sensor, and notification integrations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700;letter-spacing:.2px}.sub{font-size:14px;fill:#64748b}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#64748b}.box{stroke:#cbd5e1;stroke-width:1.5;rx:14;filter:url(#shadow)}.arr{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}</style>
</defs>
<rect width="1200" height="770" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">Smart Parking Management System</text><text x="600" y="67" text-anchor="middle" class="sub">SYSTEM ARCHITECTURE  ·  Layered client-server design</text>
<rect x="42" y="115" width="230" height="125" class="box" fill="#eff6ff"/><text x="157" y="145" text-anchor="middle" class="head">Client layer</text><text x="157" y="174" text-anchor="middle" class="body">Driver web application</text><text x="157" y="197" text-anchor="middle" class="body">Administrator dashboard</text><text x="157" y="220" text-anchor="middle" class="small">Browser · React</text>
<rect x="355" y="115" width="490" height="125" class="box" fill="#eef2ff"/><text x="600" y="145" text-anchor="middle" class="head">API / application layer</text><text x="600" y="175" text-anchor="middle" class="body">HTTPS REST API · routing · validation · authentication · RBAC</text><text x="600" y="203" text-anchor="middle" class="small">Node.js / Express</text>
<path d="M272 177 H355" class="arr"/><text x="313" y="163" text-anchor="middle" class="small">REST / JSON</text>
<rect x="355" y="290" width="490" height="168" class="box" fill="#f0fdf4"/><text x="600" y="321" text-anchor="middle" class="head">Domain / business layer</text>
<rect x="378" y="342" width="140" height="44" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="448" y="369" text-anchor="middle" class="body">Availability</text><rect x="530" y="342" width="140" height="44" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="600" y="369" text-anchor="middle" class="body">Reservations</text><rect x="682" y="342" width="140" height="44" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="752" y="369" text-anchor="middle" class="body">Parking session</text>
<rect x="430" y="400" width="160" height="40" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="510" y="425" text-anchor="middle" class="body">Billing &amp; payment</text><rect x="610" y="400" width="180" height="40" rx="8" fill="#fff" stroke="#bbf7d0"/><text x="700" y="425" text-anchor="middle" class="body">Reports &amp; notifications</text>
<path d="M600 240 V290" class="arr"/>
<rect x="355" y="505" width="490" height="72" class="box" fill="#fffbeb"/><text x="600" y="535" text-anchor="middle" class="head">Data access layer</text><text x="600" y="558" text-anchor="middle" class="body">Repositories / ORM · queries · transaction boundaries</text><path d="M600 458 V505" class="arr"/>
<rect x="355" y="625" width="490" height="112" class="box" fill="#fff7ed"/><text x="600" y="657" text-anchor="middle" class="head">Relational data store</text><text x="600" y="687" text-anchor="middle" class="body">Users · facilities · slots · reservations · sessions</text><text x="600" y="712" text-anchor="middle" class="body">Payments · audit / event records</text><text x="600" y="730" text-anchor="middle" class="small">MySQL or PostgreSQL</text><path d="M600 577 V625" class="arr"/>
<rect x="925" y="286" width="230" height="92" class="box" fill="#fdf2f8"/><text x="1040" y="318" text-anchor="middle" class="head">Payment provider</text><text x="1040" y="346" text-anchor="middle" class="body">Razorpay / Stripe</text><rect x="925" y="416" width="230" height="92" class="box" fill="#fdf2f8"/><text x="1040" y="448" text-anchor="middle" class="head">Sensor / ANPR</text><text x="1040" y="476" text-anchor="middle" class="body">Entry / exit events</text><rect x="925" y="546" width="230" height="92" class="box" fill="#fdf2f8"/><text x="1040" y="578" text-anchor="middle" class="head">Notification provider</text><text x="1040" y="606" text-anchor="middle" class="body">Email / push</text>
<path d="M845 362 H925" class="arr"/><text x="885" y="348" text-anchor="middle" class="small">Adapter</text><path d="M845 455 H925" class="arr"/><text x="885" y="441" text-anchor="middle" class="small">Webhook</text><path d="M845 423 C875 485 875 583 925 583" class="arr dash"/><text x="883" y="526" text-anchor="middle" class="small">Adapter</text>
</svg>
