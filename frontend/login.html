<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SPMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo">🅿️ SPMS</a>
  <div class="nav-links">
    <a href="register.html">Register</a>
    <a href="index.html">Home</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h2>Welcome Back</h2>

    <!-- Tabs -->
    <div class="tab-group">
      <button id="tab-driver" class="active" onclick="switchTab('driver')">🚗 Driver</button>
      <button id="tab-admin" onclick="switchTab('admin')">⚙️ Admin</button>
    </div>

    <div id="alert-box"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;" id="login-btn">
        Login
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.88rem;color:#666;">
      Don't have an account? <a href="register.html" style="color:#1a73e8;font-weight:600;">Register here</a>
    </p>

    <!-- Demo hint -->
    <div style="margin-top:20px;padding:12px;background:#f5f7fa;border-radius:8px;font-size:0.8rem;color:#555;">
      <strong>Demo Credentials:</strong><br>
      Driver → driver@demo.com / password123<br>
      Admin &nbsp;→ admin@demo.com / admin123
    </div>
  </div>
</div>

<script>
  let currentRole = 'driver';

  function switchTab(role) {
    currentRole = role;
    document.getElementById('tab-driver').classList.toggle('active', role === 'driver');
    document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
    document.getElementById('alert-box').innerHTML = '';
  }

  function showAlert(msg, type) {
    document.getElementById('alert-box').innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  function handleLogin(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Simple demo auth
    if (currentRole === 'driver' && email === 'driver@demo.com' && password === 'password123') {
      localStorage.setItem('spms_user', JSON.stringify({ name: 'Demo Driver', role: 'driver', email }));
      showAlert('Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 900);
    } else if (currentRole === 'admin' && email === 'admin@demo.com' && password === 'admin123') {
      localStorage.setItem('spms_user', JSON.stringify({ name: 'Admin', role: 'admin', email }));
      showAlert('Admin login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'admin.html', 900);
    } else {
      showAlert('Invalid credentials. Check the demo hints below.', 'error');
    }
  }
</script>
</body>
</html>
