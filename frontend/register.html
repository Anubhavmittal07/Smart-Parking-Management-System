<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SPMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="logo">🅿️ SPMS</a>
  <div class="nav-links">
    <a href="login.html">Login</a>
    <a href="index.html">Home</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card" style="max-width:480px;">
    <h2>Create Account</h2>

    <div id="alert-box"></div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="fname" placeholder="John" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lname" placeholder="Doe" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="+91 9876543210" required>
      </div>
      <div class="form-group">
        <label>Vehicle Number</label>
        <input type="text" id="vehicle" placeholder="e.g. DL01AB1234" required>
      </div>
      <div class="form-group">
        <label>Vehicle Type</label>
        <select id="vtype">
          <option value="car">🚗 Car</option>
          <option value="bike">🏍️ Bike / Scooter</option>
          <option value="suv">🚙 SUV</option>
          <option value="truck">🚛 Truck</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">
        Register
      </button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:0.88rem;color:#666;">
      Already have an account? <a href="login.html" style="color:#1a73e8;font-weight:600;">Login</a>
    </p>
  </div>
</div>

<script>
  function showAlert(msg, type) {
    document.getElementById('alert-box').innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  function handleRegister(e) {
    e.preventDefault();
    const fname   = document.getElementById('fname').value.trim();
    const lname   = document.getElementById('lname').value.trim();
    const email   = document.getElementById('email').value.trim();
    const vehicle = document.getElementById('vehicle').value.trim();

    // Save to localStorage (demo — no real backend call)
    const user = { name: `${fname} ${lname}`, email, vehicle, role: 'driver' };
    localStorage.setItem('spms_user', JSON.stringify(user));

    showAlert('Account created successfully! Redirecting to dashboard...', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 1200);
  }
</script>
</body>
</html>
